name: Generate Snake

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:
  push:
    branches:
    - master

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - uses: Platane/snk/svg-only@v3
        with:
          github_user_name: FarrukhDev-io
          outputs: |
            dist/github-contribution-grid-snake.svg?color_snake=%23ff007f&color_dots=%23ebedf0,%23f3e5f5,%23e1bee7,%23ce93d8,%23ab47bc
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark&color_snake=%2300ffff&color_dots=%23161b22,%2321092c,%234a0e4e,%23811d7e,%23b533b3
            
      - uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
